[workspace]
members = ["crates/eternal-core", "crates/eternal-debug", "crates/eternal-tui", "crates/eternal-web"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/404Simon/eternal-jukebox-rs"
rust-version = "1.89"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
rand = { version = "0.9", default-features = false, features = ["small_rng"] }
ratatui = "0.29"
realfft = "3.5"
rodio = { version = "0.22", default-features = false, features = ["playback"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
symphonia = { version = "0.6", features = ["mp3"] }
symphonia-adapter-libopus = "0.3.0"
thiserror = "2.0"
wasm-bindgen = "0.2"
getrandom = "0.4"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
similar_names = "allow"
