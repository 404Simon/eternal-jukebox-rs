name: Release

on:
  release:
    types: [published]

jobs:
  build-artifacts:
    permissions:
      contents: write
    uses: ./.github/workflows/build-artifacts.yml

  upload-release-assets:
    needs: [build-artifacts]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME=${{ github.ref_name }}
          cd artifacts
          for dir in */; do
            archive=$(find "$dir" -type f \( -name "*.tar.gz" -o -name "*.zip" \) | head -n 1)
            if [ -n "$archive" ]; then
              gh release upload "$TAG_NAME" "$archive" --clobber
            fi
          done

  publish-crate:
    needs: [upload-release-assets]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install --yes libasound2-dev cmake dbus

      - uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # eternal-tui depends on eternal-core via crates.io, so the
      # library crate has to be published first.
      - name: Publish eternal-core to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked -p eternal-core

      - name: Wait for crates.io index propagation
        run: sleep 60

      - name: Publish eternal-tui to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked -p eternal-tui
