name: build-artifacts

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build-artifacts:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      BUILD_NAME: "eternal-jukebox-${{ github.ref_name }}-${{ matrix.target }}"
    strategy:
      fail-fast: false
      matrix:
        # No musl target: the binary links against ALSA and libopus, which
        # cannot be statically cross-built with stock musl-tools.
        build: [linux-x64, windows-x64, macos-x64, macos-arm64]
        include:
        - build: linux-x64
          os: ubuntu-latest
          target: x86_64-unknown-linux-gnu
        - build: windows-x64
          os: windows-latest
          target: x86_64-pc-windows-msvc
        - build: macos-x64
          os: macos-15-intel
          target: x86_64-apple-darwin
        - build: macos-arm64
          os: macos-latest
          target: aarch64-apple-darwin

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Install system dependencies
      if: matrix.os == 'ubuntu-latest'
      run: sudo apt-get update && sudo apt-get install --yes libasound2-dev cmake

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Setup Rust cache
      uses: Swatinem/rust-cache@v2
      with:
        cache-on-failure: true

    - name: Build release binary
      run: cargo build --verbose --release --locked --target ${{ matrix.target }} -p eternal-tui

    - name: Bundle release (Unix)
      if: matrix.os != 'windows-latest'
      shell: bash
      run: |
        mkdir -p "$BUILD_NAME"
        cp {README.md,LICENSE} "$BUILD_NAME/"
        cp "target/${{ matrix.target }}/release/eternal" "$BUILD_NAME/"
        chmod +x "$BUILD_NAME/eternal"

    - name: Bundle release (Windows)
      if: matrix.os == 'windows-latest'
      shell: bash
      run: |
        mkdir -p "$BUILD_NAME"
        cp README.md LICENSE "$BUILD_NAME/"
        cp "target/${{ matrix.target }}/release/eternal.exe" "$BUILD_NAME/"

    - name: Create tarball (Unix)
      if: matrix.os != 'windows-latest'
      shell: bash
      run: |
        tar -czf "$BUILD_NAME.tar.gz" "$BUILD_NAME"

    - name: Create zip archive (Windows)
      if: matrix.os == 'windows-latest'
      shell: bash
      run: |
        7z a "$BUILD_NAME.zip" "$BUILD_NAME"

    - name: Upload artifact (Unix)
      if: matrix.os != 'windows-latest'
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.BUILD_NAME }}
        path: ${{ env.BUILD_NAME }}.tar.gz
        if-no-files-found: error

    - name: Upload artifact (Windows)
      if: matrix.os == 'windows-latest'
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.BUILD_NAME }}
        path: ${{ env.BUILD_NAME }}.zip
        if-no-files-found: error
